name: Build V16.6 Decode Boundary Probe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 dylib
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter \
            -dynamiclib -framework Foundation \
            -install_name @rpath/V16_6DecodeBoundaryProbe.dylib \
            V16_6DecodeBoundaryProbe.m -o V16_6DecodeBoundaryProbe.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: V16_6DecodeBoundaryProbe
          path: V16_6DecodeBoundaryProbe.dylib
