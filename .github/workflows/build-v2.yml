name: Build PlayURLLoggerV2on:  workflow_dispatch:  push:    branches: [ main, master ]jobs:  build:    runs-on: macos-15    steps:      - uses: actions/checkout@v4      - name: Build arm64 iOS dylib        run: |          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"          xcrun --sdk iphoneos clang \            -arch arm64 \            -dynamiclib \            -fobjc-arc \            -isysroot "$SDK" \            -miphoneos-version-min=14.0 \            -framework Foundation \            -install_name @rpath/PlayURLLoggerV2.dylib \            PlayURLLoggerV2.m \            -o PlayURLLoggerV2.dylib          file PlayURLLoggerV2.dylib      - name: Upload dylib        uses: actions/upload-artifact@v4        with:          name: PlayURLLoggerV2          path: PlayURLLoggerV2.dylib
