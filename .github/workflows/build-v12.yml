name: Build V12 HWLLS Downgrade Inspector
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -fblocks -dynamiclib -framework Foundation \
            -install_name @rpath/V12HWLLSInspector.dylib \
            V12HWLLSInspector.m -o V12HWLLSInspector.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: V12HWLLSInspector
          path: V12HWLLSInspector.dylib
