
name: Build PaidPreviewV3.4.1 V20 Diagnostic Exporter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            PaidPreviewV3_4_1_V20DiagnosticExporter.m \
            -o PaidPreviewV3_4_1_V20DiagnosticExporter.dylib
          file PaidPreviewV3_4_1_V20DiagnosticExporter.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: PaidPreviewV3_4_1_V20DiagnosticExporter
          path: PaidPreviewV3_4_1_V20DiagnosticExporter.dylib
