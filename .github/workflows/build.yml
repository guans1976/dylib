
name: Build PaidPreviewV3.2.1 V20 Compare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            PaidPreviewV3_2_1_V20Compare.m \
            -o PaidPreviewV3_2_1_V20Compare.dylib
          file PaidPreviewV3_2_1_V20Compare.dylib
          shasum -a 256 PaidPreviewV3_2_1_V20Compare.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaidPreviewV3_2_1_V20Compare
          path: PaidPreviewV3_2_1_V20Compare.dylib
