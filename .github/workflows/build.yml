
name: Build PaidPreviewV3.3 Active Path Trace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fobjc-arc \
            -framework Foundation \
            PaidPreviewV3_3_ActivePathTrace.m \
            -o PaidPreviewV3_3_ActivePathTrace.dylib
          file PaidPreviewV3_3_ActivePathTrace.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: PaidPreviewV3_3_ActivePathTrace
          path: PaidPreviewV3_3_ActivePathTrace.dylib
