name: Build V15 Playback Export
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 dylib
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter \
            -dynamiclib -framework Foundation \
            -install_name @rpath/V15PlaybackExport.dylib \
            V15PlaybackExport.m -o V15PlaybackExport.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: V15PlaybackExport
          path: V15PlaybackExport.dylib
