name: Build PlayURLLoggerV3on:  workflow_dispatch:  push:    branches: [ main, master ]jobs:  build:    runs-on: macos-15    steps:      - uses: actions/checkout@v4      - name: Build arm64 iOS dylib        run: |          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"          xcrun --sdk iphoneos clang \            -arch arm64 \            -dynamiclib \            -fobjc-arc \            -isysroot "$SDK" \            -miphoneos-version-min=14.0 \            -framework Foundation \            -install_name @rpath/PlayURLLoggerV3.dylib \            PlayURLLoggerV3.m \            -o PlayURLLoggerV3.dylib          file PlayURLLoggerV3.dylib      - name: Upload dylib        uses: actions/upload-artifact@v4        with:          name: PlayURLLoggerV3          path: PlayURLLoggerV3.dylib
