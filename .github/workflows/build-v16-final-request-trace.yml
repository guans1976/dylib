name: Build V16 Final Request Trace

on:
  workflow_dispatch:
  push:
    paths:
      - "V16FinalRequestTrace.m"
      - "V16FinalRequestTrace.plist"
      - "Makefile"
      - "control"
      - ".github/workflows/build-v16-final-request-trace.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid dpkg make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootless package
        run: |
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: V16FinalRequestTrace-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
