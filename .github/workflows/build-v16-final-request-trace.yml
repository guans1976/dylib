name: Build V16 Final Request Trace Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - "V16FinalRequestTrace.m"
      - "V16FinalRequestTrace.plist"
      - "Makefile"
      - ".github/workflows/build-v16-final-request-trace.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid make

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build dylib
        run: |
          export THEOS="$HOME/theos"
          make clean
          make FINALPACKAGE=1
          echo "=== built files ==="
          find .theos -type f \( -name "*.dylib" -o -name "*.plist" \) -print

      - name: Collect dylib
        run: |
          mkdir -p artifact
          DYLIB="$(find .theos -type f -name 'V16FinalRequestTrace.dylib' | head -n 1)"
          if [ -z "$DYLIB" ]; then
            echo "V16FinalRequestTrace.dylib not found"
            exit 1
          fi
          cp "$DYLIB" artifact/V16FinalRequestTrace.dylib
          cp V16FinalRequestTrace.plist artifact/V16FinalRequestTrace.plist
          ls -l artifact

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: V16FinalRequestTrace-dylib
          path: artifact/*
          if-no-files-found: error
