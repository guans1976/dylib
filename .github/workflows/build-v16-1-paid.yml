name: Build V16.1 Paid Playback Extension
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 dylib
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter \
            -dynamiclib -framework Foundation \
            -install_name @rpath/V16_1PaidPlaybackExport.dylib \
            V16_1PaidPlaybackExport.m -o V16_1PaidPlaybackExport.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: V16_1PaidPlaybackExport
          path: V16_1PaidPlaybackExport.dylib
