name: Build PaidPreviewV1
on:
  workflow_dispatch:
  push:
    paths:
      - 'PaidPreviewV1.m'
      - '.github/workflows/build-paid-preview-v1.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: |
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib \
            -framework Foundation \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            PaidPreviewV1.m \
            -o PaidPreviewV1.dylib
          file PaidPreviewV1.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: PaidPreviewV1
          path: PaidPreviewV1.dylib
