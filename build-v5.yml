name: Build PlayURLLoggerV5
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 -dynamiclib -fobjc-arc -fblocks \
            -isysroot "$SDK" -miphoneos-version-min=14.0 \
            -framework Foundation \
            -install_name @rpath/PlayURLLoggerV5.dylib \
            PlayURLLoggerV5.m -o PlayURLLoggerV5.dylib
          file PlayURLLoggerV5.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: PlayURLLoggerV5
          path: PlayURLLoggerV5.dylib
